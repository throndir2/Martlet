# Martlet host role: Pictures. Martlet draws pictures with ComfyUI and Z-Image Turbo.
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
title=Pictures: Martlet draws pictures with ComfyUI and Z-Image Turbo (needs an NVIDIA GPU with 8 GB+ memory)
gateway_kind=pictures
port=50086
ready_timeout_minutes=20
requires=gpu docker nvidia-toolkit
terms=Pictures runs in a container Martlet builds on this host from python:3.12 with pinned PyTorch 2.10 (CUDA 12.8) and ComfyUI v0.39.0 (github.com/comfyanonymous/ComfyUI at commit b0b7435, GPL-3.0). It downloads about 19.3 GiB (20.7 GB) of pinned Apache-2.0 model files from huggingface.co/Comfy-Org/z_image_turbo revision 6fc90a3: split_files/diffusion_models/z_image_turbo_bf16.safetensors, split_files/text_encoders/qwen_3_4b.safetensors and split_files/vae/ae.safetensors. Using them means accepting ComfyUI, PyTorch and Z-Image Turbo licenses. Do not use it for illegal or harmful content, do not depict real people without their consent, and disclose AI-generated images. Martlet calls ComfyUI's free-memory API after idle picture work so it frees the graphics card for voice and thinking roles.
# Pictures needs the NVIDIA GPU. It is not a voice engine: it runs beside speaking and singing.
gpu=required|compose.gpu.yaml
choice=PICTURES_MODEL|Picture model|z-image-turbo|z-image-turbo
model_from=PICTURES_MODEL
# Download and verify the pinned model files into the martlet-pictures-models volume (kept on re-add). The files load only
# when ComfyUI runs a workflow.
post_start=pictures|martlet-pictures provision
