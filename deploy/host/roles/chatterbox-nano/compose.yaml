# Martlet Chatterbox Nano voice host service (the bot's speaking), loopback-only behind the Martlet gateway.
# The same image as the chatterbox role, built on this host from Martlet's workers/chatterbox sources
# (workers/chatterbox/host/Dockerfile), with the 110M Nano model. "martlet-host add chatterbox-nano" adds compose.gpu.yaml
# when the role runs on this host's NVIDIA GPU (MARTLET_CHATTERBOX_DEVICE=auto then finds it; without it the service runs on
# the CPU), then runs "martlet-chatterbox provision" (downloads and verifies the pinned model files into the
# martlet-chatterbox-nano-models volume) and "martlet-chatterbox warm". The service listens only on 127.0.0.1:50088.

services:
  chatterbox-nano:
    build:
      context: ${MARTLET_SOURCE:?set by martlet-host}/workers/chatterbox
      dockerfile: host/Dockerfile
    image: martlet-chatterbox:9
    pull_policy: build
    restart: unless-stopped
    environment:
      CHATTERBOX_MODEL: ${CHATTERBOX_MODEL:-chatterbox-nano}
      MARTLET_CHATTERBOX_DEVICE: auto
      MARTLET_CHATTERBOX_PORT: "50088"
    volumes:
      - models:/opt/martlet-chatterbox/models
    network_mode: ${MARTLET_ROLE_NETWORK:?set by martlet-host}

volumes:
  models:
    name: martlet-chatterbox-nano-models