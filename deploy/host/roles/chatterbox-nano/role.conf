# Martlet host role: Resemble AI Chatterbox Nano voice (the bot's speaking), cloned from a reference recording you choose.
title=Chatterbox Nano voice: a small Chatterbox with laughs and sighs that runs on an NVIDIA GPU or, without one, on the CPU
gateway_kind=chatterbox-nano
port=50088
ready_timeout_minutes=15
requires=x86_64 docker
terms=Chatterbox Nano runs in a container Martlet builds on this host from python:3.12.10 with hash-pinned PyTorch 2.8.0 (its CUDA 12.8 build, which also runs on the CPU), chatterbox-tts 0.1.7 and transformers 5.2.0 (a large download). It then downloads the pinned Chatterbox-Nano model (1.9 GB) from huggingface.co/ResembleAI/chatterbox-nano, licensed MIT. It uses this host's NVIDIA GPU when it has one and the CPU otherwise. Every reply carries Resemble AI's imperceptible Perth watermark. The voice is cloned from reference audio your desktop sends with each reply (longer than 5 seconds), and Martlet may pass Chatterbox's native sound tags; only use voices that are yours or that you have permission to use.
# Uses the NVIDIA GPU when this host can run GPU containers (the default then), otherwise the CPU.
gpu=optional|compose.gpu.yaml
# One voice engine per host: adding this role stops the other installed voice engines first.
exclusive=voice
choice=CHATTERBOX_MODEL|Chatterbox voice model|chatterbox-nano|chatterbox-nano
model_from=CHATTERBOX_MODEL
# Download and verify the pinned model files into the martlet-chatterbox-nano-models volume (kept on re-add), then load
# the model once so the first reply does not wait for it.
post_start=chatterbox-nano|martlet-chatterbox provision
warm=chatterbox-nano|martlet-chatterbox warm