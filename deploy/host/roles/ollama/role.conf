# Martlet host role: Ollama conversation model (the bot's thinking).
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
title=Ollama conversation model: the bot's thinking (an NVIDIA GPU makes it fast; small models also run on the CPU)
gateway_kind=ollama
port=11434
ready_timeout_minutes=5
requires=docker
terms=Ollama (MIT) runs as the official ollama/ollama container and downloads the model you choose from ollama.com. Each model has its own license (Gemma 4: Apache-2.0; Gemma 3: Gemma Terms of Use; Qwen3-VL, Qwen2.5-VL 7B and Qwen 2.5 7B/14B: Apache-2.0; Llama 3.x: Llama Community License); using it means accepting that license.
# Uses the NVIDIA GPU when this host can run GPU containers (the default then), otherwise the CPU.
gpu=optional|compose.gpu.yaml
# gemma4 and qwen3-vl see images (Watch my screen) and call tools; gemma3 and qwen2.5vl only see; the others are text-only.
choice=OLLAMA_MODEL|Conversation model (bigger is smarter and needs more GPU memory; gemma4, qwen3-vl, gemma3 and qwen2.5vl can also see your screen)|gemma4:e2b gemma4:e4b qwen3-vl:8b gemma4:12b gemma4:26b gemma3:4b qwen2.5vl:7b gemma3:12b gemma3:27b llama3.2:3b qwen2.5:7b llama3.1:8b qwen2.5:14b|gemma4:e2b
# Suggested model by GPU memory in MiB (ascending); CPU-only hosts get the smallest. All suggestions see and call tools.
choice_by_vram=OLLAMA_MODEL|0@gemma4:e2b 7000@gemma4:e4b 11000@gemma4:12b 22000@gemma4:26b
model_from=OLLAMA_MODEL
# Download the chosen model into the martlet-ollama-models volume once the server is up (kept on re-add), then load it
# with one short reply so the first conversation does not wait for it (the server keeps it loaded).
post_start=ollama|ollama pull {OLLAMA_MODEL}
post_start=ollama|ollama run {OLLAMA_MODEL} Say ready
