# Martlet host role: Ollama conversation model (the bot's thinking).
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
title=Ollama conversation model: the bot's thinking (an NVIDIA GPU makes it fast; small models also run on the CPU)
gateway_kind=ollama
port=11434
ready_timeout_minutes=5
requires=docker
terms=Ollama (MIT) runs as the official ollama/ollama container and downloads the model you choose from ollama.com. Each model has its own license (Gemma 3: Gemma Terms of Use; Qwen2.5-VL 7B and Qwen 2.5 7B/14B: Apache-2.0; Llama 3.x: Llama Community License); using it means accepting that license.
# Uses the NVIDIA GPU when this host can run GPU containers (the default then), otherwise the CPU.
gpu=optional|compose.gpu.yaml
# gemma3 and qwen2.5vl also see images, so Martlet can watch the screen with them (Watch my screen); the others are text-only.
choice=OLLAMA_MODEL|Conversation model (bigger is smarter and needs more GPU memory; gemma3 and qwen2.5vl can also see your screen)|gemma3:4b qwen2.5vl:7b gemma3:12b gemma3:27b llama3.2:3b qwen2.5:7b llama3.1:8b qwen2.5:14b|gemma3:4b
# Suggested model by GPU memory in MiB (ascending); CPU-only hosts get the smallest. All suggestions can see.
choice_by_vram=OLLAMA_MODEL|0@gemma3:4b 7000@qwen2.5vl:7b 11000@gemma3:12b 20000@gemma3:27b
model_from=OLLAMA_MODEL
# Download the chosen model into the martlet-ollama-models volume once the server is up (kept on re-add), then load it
# with one short reply so the first conversation does not wait for it (the server keeps it loaded).
post_start=ollama|ollama pull {OLLAMA_MODEL}
post_start=ollama|ollama run {OLLAMA_MODEL} Say ready
