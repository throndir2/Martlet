# Martlet host role: XTTS-v2 custom voice (the bot's speaking), cloned from a reference recording you choose and streamed
# while it is generated, so replies start sooner. Every role is installed by the same "martlet-host add <role>" flow; this
# file is data only.
title=XTTS-v2 voice: the bot speaks in a voice cloned from your reference recording and starts before a sentence is finished (needs an NVIDIA GPU with 4 GB+ memory)
gateway_kind=xtts
port=50081
ready_timeout_minutes=10
requires=gpu docker nvidia-toolkit
terms=XTTS-v2 runs in a container Martlet builds on this host from python:3.12.10 with hash-pinned PyTorch 2.6.0 (CUDA 12.4) and coqui-tts 0.27.5 (Idiap's maintained fork of Coqui TTS, MPL-2.0 source; a large download). It then downloads the pinned XTTS-v2 model (about 1.9 GB) from huggingface.co/coqui/XTTS-v2, licensed under the Coqui Public Model License 1.0.0, which allows only non-commercial use of the model and of the speech it makes. Using it means accepting that license. The voice is cloned from reference audio your desktop sends with each reply; only use voices that are yours or that you have permission to use.
# XTTS needs the NVIDIA GPU (the worker runs on cuda:0); the overlay reserves it for the container.
gpu=required|compose.gpu.yaml
choice=XTTS_MODEL|XTTS voice model|xtts-v2|xtts-v2
choice=XTTS_LANGUAGE|Language the bot speaks|en es fr de it pt pl tr ru nl cs ar zh-cn hu ko ja hi|en
model_from=XTTS_MODEL
# Download and verify the pinned model files into the martlet-xtts-models volume (kept on re-add), then load the model
# once so the first reply does not wait for it.
post_start=xtts|martlet-xtts provision
post_start=xtts|martlet-xtts warm