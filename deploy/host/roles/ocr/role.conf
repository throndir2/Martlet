# Martlet host role: Reading. Martlet reads screen text with RapidOCR or PaddleOCR's PP-OCRv5.
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
# Both engines answer the same loopback HTTP service on 127.0.0.1:50087 (workers/ocr/host/martlet_ocr_host.py), so the
# gateway's OCR relay and the desktops treat them alike:
#   rapidocr  RapidOCR 1.4.4 with its PP-OCRv4 models, on the CPU (small and fast)
#   ppocrv5   RapidOCR 3.10.0 with PP-OCRv5 models (the most accurate): mobile on the CPU or an NVIDIA GPU, server on an
#             NVIDIA GPU (on the CPU the server model takes about a minute a screenshot)
title=Reading: Martlet reads text on your screen (RapidOCR on the processor, or the more accurate PP-OCRv5 on the processor or an NVIDIA graphics card)
gateway_kind=ocr
port=50087
ready_timeout_minutes=15
requires=docker
terms=Paired computers send screenshots while Martlet watches the screen. The service reads them in memory and does not store them.
choice=OCR_ENGINE|Text reader (rapidocr: the smallest, on the processor; ppocrv5: the most accurate and about as fast, on the processor or an NVIDIA graphics card)|rapidocr ppocrv5|rapidocr
model_from=OCR_MODEL
profile_from=OCR_ENGINE
# Hosts that installed Reading before it had engines run RapidOCR.
profile_legacy=rapidocr

[OCR_ENGINE=rapidocr]
terms=Reading builds a container from python:3.12 with hash-pinned RapidOCR 1.4.4 (Apache-2.0) and its PaddleOCR PP-OCRv4 models (Apache-2.0, inside the package, about 15 MB), ONNX Runtime (MIT) and OpenCV (Apache-2.0). It runs on the processor.
choice=OCR_MODEL|Text reader model|rapidocr-ppocrv4|rapidocr-ppocrv4
[end]

[OCR_ENGINE=ppocrv5]
terms=Reading builds a container from python:3.12 with hash-pinned RapidOCR 3.10.0 (Apache-2.0), ONNX Runtime 1.31.0 (MIT) and OpenCV (Apache-2.0), and PaddleOCR's PP-OCRv5 mobile and server models (Apache-2.0, about 190 MB) from RapidOCR's ModelScope release v3.10.0 (or an identical Hugging Face copy), each SHA-256 checked. They read Chinese, English and Japanese. On the GPU it also installs NVIDIA's CUDA 13 and cuDNN libraries from PyPI (about 2 GB; NVIDIA's license) and needs an NVIDIA driver for CUDA 13 (580 or newer); otherwise choose cpu.
# Uses the NVIDIA GPU when this host can run GPU containers (the default then), otherwise the CPU.
gpu=optional|compose.gpu.yaml
choice=OCR_MODEL|PP-OCRv5 model (mobile: a few seconds a screenshot on the processor; server: the most accurate, for an NVIDIA graphics card only, as on the processor it takes about a minute)|ppocrv5-mobile ppocrv5-server|ppocrv5-mobile
# Suggested model by GPU memory in MiB (ascending); CPU-only hosts get mobile.
choice_by_vram=OCR_MODEL|0@ppocrv5-mobile 2000@ppocrv5-server
[end]
