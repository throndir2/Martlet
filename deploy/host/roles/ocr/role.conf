# Martlet host role: Reading. Martlet reads screen text with RapidOCR.
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
title=Reading: Martlet reads text on your screen with RapidOCR (runs on the processor; no graphics card needed)
gateway_kind=ocr
port=50087
ready_timeout_minutes=15
requires=docker
terms=Reading builds a container from python:3.12 with hash-pinned RapidOCR 1.4.4 (Apache-2.0) and its PaddleOCR PP-OCRv4 models (Apache-2.0, inside the package, about 15 MB), ONNX Runtime (MIT) and OpenCV (Apache-2.0). Paired computers send screenshots while Martlet watches the screen. The service reads them in memory and does not store them.
choice=OCR_MODEL|Text reader|rapidocr-ppocrv4|rapidocr-ppocrv4
model_from=OCR_MODEL
