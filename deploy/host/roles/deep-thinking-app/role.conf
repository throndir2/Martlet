# Martlet host role: the Thinking pool with a chat model the owner's own model app already serves on this host (LM Studio,
# llama.cpp's server, vLLM, Jan, KoboldCpp, Lemonade, SGLang and the others). Martlet runs nothing for it: the gateway relays the
# Thinking pool's requests to that app's OpenAI-compatible API on 127.0.0.1, and the app keeps the model loaded.
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
title=Thinking pool with a model your own app serves on this host (LM Studio, llama.cpp, vLLM and others)
# The gateway relays it on the same route as the deep-thinking role (the Thinking pool on card 1): paired desktops join it by
# themselves.
gateway_kind=deep-thinking-app
# Nothing to install on this host: the owner's app is already there.
requires=
# Nothing to run: the gateway relays to the app's OpenAI-compatible API (external=openai). The host service must run natively
# (not in Docker), so the gateway can reach the app on this host's 127.0.0.1.
external=openai
# One Thinking pool model on card 1: adding this role stops the deep-thinking role's own Ollama (its downloads are kept), and
# adding that role again stops this one.
exclusive=deep-thinking
terms=Martlet installs and downloads nothing for this role. Paired desktops send the Thinking pool's jobs (for a think, the task and the conversation so far) to your app on this host, which runs the model under that model's own license.
# The app's port and API path, as Martlet found them (LM Studio 1234, llama.cpp 8080, vLLM 8000, Jan 1337, KoboldCpp 5001,
# Lemonade 13305 or 8000 with /api/v1, SGLang 30000, text-generation-webui 5000, GPT4All 4891, Docker Model Runner 12434 with
# /engines/v1, LiteLLM 4000).
choice=APP_PORT|Your model app's port|1234 8080 8000 1337 5001 13305 30000 5000 4891 12434 4000|1234
port_from=APP_PORT
choice=APP_PATH|Your model app's API path|/v1 /api/v1 /engines/v1|/v1
path_from=APP_PATH
# The model, as the app lists it at {path}/models (any name it lists; the role checks it does).
choice=APP_MODEL|The model your app serves (as it lists it)|model|model
choice_open=APP_MODEL
model_from=APP_MODEL