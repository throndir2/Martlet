# Martlet host role: the original Resemble AI Chatterbox voice (the bot's speaking), cloned from a reference recording you choose.
title=Chatterbox Original voice: the original 500M Chatterbox, which says each sentence calmly or expressively as the reply asks (needs an NVIDIA GPU with 6 GB+ memory)
gateway_kind=chatterbox-original
port=50089
ready_timeout_minutes=15
requires=x86_64 gpu docker nvidia-toolkit
terms=Chatterbox Original runs in a container Martlet builds on this host from python:3.12.10 with hash-pinned PyTorch 2.8.0 CUDA 12.8, chatterbox-tts 0.1.7 and transformers 5.2.0 (a large download), which needs an NVIDIA GPU of the GeForce GTX 16 / RTX 20 series or newer (RTX 50 series included). It then downloads the pinned original English Chatterbox model (3.2 GB; not its multilingual weights or its built-in voice) from huggingface.co/ResembleAI/chatterbox, licensed MIT. Every reply carries Resemble AI's imperceptible Perth watermark. The voice is cloned from reference audio your desktop sends with each reply (longer than 5 seconds), with the exaggeration and CFG weight you choose in Martlet; only use voices that are yours or that you have permission to use.
# It needs the NVIDIA GPU (the worker runs on cuda:0); the overlay reserves it for the container.
gpu=required|compose.gpu.yaml
# One voice engine per host: adding this role stops the other installed voice engines first.
exclusive=voice
choice=CHATTERBOX_MODEL|Chatterbox voice model|chatterbox-original|chatterbox-original
model_from=CHATTERBOX_MODEL
# Download and verify the pinned model files into the martlet-chatterbox-original-models volume (kept on re-add), then
# load the model once so the first reply does not wait for it.
post_start=chatterbox-original|martlet-chatterbox provision
warm=chatterbox-original|martlet-chatterbox warm