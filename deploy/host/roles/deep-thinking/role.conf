# Martlet host role: Deep thinking's own model (the bot thinking things over in the background).
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
# A second Ollama server of its own, beside the ollama role's conversation model: each answers on its own, so a think runs
# while replies keep coming, on a host that also does Thinking or on one that does nothing else.
title=Deep thinking: its own Ollama model that thinks things over while the conversation carries on (an NVIDIA GPU makes it fast)
gateway_kind=deep-thinking
port=11435
ready_timeout_minutes=5
requires=docker
terms=Ollama (MIT) runs as the official ollama/ollama container, separate from the conversation model's, and downloads the model you choose from ollama.com into the volume martlet-deep-thinking-models. Each model has its own license (Gemma 4: Apache-2.0; Gemma 3: Gemma Terms of Use; Qwen3-VL, Qwen2.5-VL 7B and Qwen 2.5 7B/14B: Apache-2.0; Llama 3.x: Llama Community License); using it means accepting that license. Paired desktops send it the task and the conversation so far when Martlet thinks something over. It shares the graphics card with the host's other roles.
# Uses the NVIDIA GPU when this host can run GPU containers (the default then), otherwise the CPU (slow, but a think runs
# in the background).
gpu=optional|compose.gpu.yaml
# The same models, default and suggestions by GPU memory as the ollama role's conversation model (Thinking), so Thinking and
# Deep thinking always recommend the same models (HostRolesTests checks they match). A model that can't think step by step
# still works: the think is asked again without Thinking steps.
choice=OLLAMA_MODEL|Deep thinking model (bigger thinks better and needs more GPU memory; it shares the card with the host's other roles; gemma4, qwen3-vl, gemma3 and qwen2.5vl can also see pictures)|gemma4:e2b gemma4:e4b qwen3-vl:8b gemma4:12b gemma4:26b gemma3:4b qwen2.5vl:7b gemma3:12b gemma3:27b llama3.2:3b qwen2.5:7b llama3.1:8b qwen2.5:14b|gemma4:e2b
# Suggested model by GPU memory in MiB (ascending); CPU-only hosts get the smallest.
choice_by_vram=OLLAMA_MODEL|0@gemma4:e2b 7000@gemma4:e4b 11000@gemma4:12b 22000@gemma4:26b
model_from=OLLAMA_MODEL
# Thinks at once: Ollama's OLLAMA_NUM_PARALLEL for this server, so one graphics card runs several background thinks at the same
# time and counts as that many places for them. Each slot beyond the first holds another think's context in the card's memory
# from when the model loads (the model itself is loaded once), so Martlet recommends what fits beside the host's other roles.
choice=OLLAMA_NUM_PARALLEL|Thinks at once (each one beyond the first needs room on the graphics card for another think's context)|1 2 3 4|1
# The gateway admits that many thinks at once on Deep thinking's route and advertises it to paired desktops.
slots_from=OLLAMA_NUM_PARALLEL
# Download the chosen model into the martlet-deep-thinking-models volume once the server is up (kept on re-add), then load
# it with one short reply so the first think does not wait for it (the server keeps it loaded).
post_start=ollama|ollama pull {OLLAMA_MODEL}
warm=ollama|ollama run {OLLAMA_MODEL} Say ready
# Switching models: the old one thinks until the new one is downloaded and loaded (above) and the gateway relays it, then
# leaves the graphics card's memory (it stays downloaded, so switching back is quick).
retire=ollama|ollama stop {PREVIOUS}
