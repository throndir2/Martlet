# Martlet host role: Dia voice (the bot's speaking), cloned from a reference recording you choose, with laughs and sighs.
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
title=Dia voice: the bot speaks in a voice cloned from your reference recording and can laugh, sigh, cough and gasp (English only; needs an NVIDIA GPU with 8 GB+ memory)
gateway_kind=dia
port=50084
ready_timeout_minutes=20
requires=x86_64 gpu docker nvidia-toolkit
terms=Dia by Nari Labs (Apache-2.0 source, github.com/nari-labs/dia at commit 876125e) runs in a container Martlet builds on this host from python:3.12.10 with hash-pinned PyTorch 2.6.0 (CUDA 12.4) and descript-audio-codec 1.0.0 (MIT) (a large download). It then downloads the pinned Dia-1.6B-0626 model (6.4 GB) from huggingface.co/nari-labs/Dia-1.6B-0626, licensed Apache-2.0, and the Descript Audio Codec 44 kHz weights from github.com/descriptinc/descript-audio-codec, licensed MIT. Using them means accepting those licenses. Nari Labs forbids using Dia to imitate real people without their permission, for deceptive content or for anything illegal or harmful. The voice is cloned from reference audio your desktop sends with each reply; only use voices that are yours or that you have permission to use.
# Dia needs the NVIDIA GPU (the worker runs on cuda:0); the overlay reserves it for the container.
gpu=required|compose.gpu.yaml
# One voice engine per host: adding this role stops the other installed voice engines first, so the model each keeps
# in the graphics card's memory never starves this one (their downloads and images are kept for switching back).
exclusive=voice
choice=DIA_MODEL|Dia voice model|dia-1.6b-0626|dia-1.6b-0626
model_from=DIA_MODEL
# Download and verify the pinned model and codec files into the martlet-dia-models volume (kept on re-add), then load
# the model once so the first reply does not wait for it.
post_start=dia|martlet-dia provision
warm=dia|martlet-dia warm
