# Martlet host role: Home Assistant smart home hub.
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
title=Home Assistant: your smart home hub (finds and controls lights, sensors, speakers and more on your network)
requires=docker-engine
network=host
port=8123
ready_timeout_minutes=10
feature=home-assistant
terms=Home Assistant (Apache-2.0) runs as the official ghcr.io/home-assistant/home-assistant container on this computer's own network (port 8123 on your LAN), with access to its USB devices and Bluetooth (privileged) so it can find and control your smart home devices. Its configuration is kept in the martlet-home-assistant-config volume. Martlet then creates your Home Assistant owner account and connects to it.
