# Martlet host role: speech-to-text with whisper.cpp (the bot's hearing).
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
title=Speech-to-text with whisper.cpp: the bot's hearing (an NVIDIA GPU makes it fast; it also runs well on the CPU)
gateway_kind=stt
port=8178
# The first start downloads the chosen model (up to 1.6 GB) before the server listens.
ready_timeout_minutes=30
requires=docker
terms=whisper.cpp (MIT) runs as its official ghcr.io/ggml-org/whisper.cpp container, pinned to release 1.9.4. On its first start it downloads the Whisper model you choose (OpenAI Whisper weights, MIT) from Hugging Face (ggerganov/whisper.cpp at a pinned revision, SHA-256 checked) into the volume martlet-stt-models. Paired desktops then send your recorded speech to this host one utterance at a time; it is transcribed in memory and not stored. On the GPU it needs an NVIDIA driver for CUDA 13 (580 or newer); otherwise choose cpu.
# Uses the NVIDIA GPU when this host can run GPU containers (the default then), otherwise the CPU.
gpu=optional|compose.gpu.yaml
choice=STT_MODEL|Speech-to-text model (bigger is more accurate, needs more memory and time)|base small medium large-v3-turbo|small
# Suggested model by GPU memory in MiB (ascending); CPU-only hosts get small.
choice_by_vram=STT_MODEL|0@small 4000@large-v3-turbo
model_from=STT_MODEL
# Download the chosen model before the running server is replaced, so changing the model (or GPU and CPU) keeps hearing
# working during the download and only restarts the server.
prepare=stt
