# Martlet host role: speech-to-text (the bot's hearing), with whisper.cpp or NVIDIA Parakeet.
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
# Both engines answer whisper.cpp's POST /inference on 127.0.0.1:8178, so the gateway and desktops treat them alike:
#   whisper   whisper.cpp's official container, on the NVIDIA GPU or the CPU (any of whisper's languages)
#   parakeet  NVIDIA Parakeet through sherpa-onnx on the CPU, built on this host from workers/parakeet: the models Martlet's
#             desktop runs on its own processor (English, or 25 European languages)
title=Speech-to-text: the bot's hearing (whisper.cpp, fast on an NVIDIA GPU and fine on the CPU, or NVIDIA Parakeet, fastest on the CPU)
gateway_kind=stt
port=8178
# The first start downloads the chosen model (up to 1.6 GB) before the server listens.
ready_timeout_minutes=30
requires=docker
terms=Paired desktops send your recorded speech to this host one utterance at a time; it is transcribed in memory and not stored.
choice=STT_ENGINE|Speech recognizer (whisper: many languages, fastest on an NVIDIA GPU; parakeet: fastest on the CPU, English or 25 European languages)|whisper parakeet|whisper
model_from=STT_MODEL
profile_from=STT_ENGINE
# Hosts that installed stt before it had engines run whisper.
profile_legacy=whisper

[STT_ENGINE=whisper]
terms=whisper.cpp (MIT) runs as its official ghcr.io/ggml-org/whisper.cpp container, pinned to release 1.9.4. On its first start it downloads the Whisper model you choose (OpenAI Whisper weights, MIT) from Hugging Face (ggerganov/whisper.cpp at a pinned revision, SHA-256 checked) into the volume martlet-stt-models. On the GPU it needs an NVIDIA driver for CUDA 13 (580 or newer); otherwise choose cpu.
# Uses the NVIDIA GPU when this host can run GPU containers (the default then), otherwise the CPU.
gpu=optional|compose.gpu.yaml
# ARM64 hosts run whisper.cpp's official arm64 image of the same commit instead, on the CPU.
arm64=compose.arm64.yaml
choice=STT_MODEL|Whisper model (bigger is more accurate, needs more memory and time)|base small medium large-v3-turbo|small
# Suggested model by GPU memory in MiB (ascending); CPU-only hosts get small.
choice_by_vram=STT_MODEL|0@small 4000@large-v3-turbo
# Download the chosen model before the running server is replaced, so changing the model (or GPU and CPU) keeps hearing
# working during the download and only restarts the server.
prepare=stt
[end]

[STT_ENGINE=parakeet]
terms=Parakeet runs on this host's CPU with sherpa-onnx 1.13.8 (Apache-2.0), in a container Martlet builds here from its workers/parakeet sources (Python 3.12 and hash-pinned packages from PyPI). It downloads the Parakeet model you choose (NVIDIA, CC BY 4.0; 480 to 670 MB) from Hugging Face (sherpa-onnx's ONNX export at a pinned revision, each file SHA-256 checked) into the volume martlet-stt-parakeet-models. parakeet-tdt-110m-en is the fastest and parakeet-tdt-0.6b-v2-int8 the most accurate in English; parakeet-tdt-0.6b-v3-int8 understands 25 European languages.
choice=STT_MODEL|Parakeet model (110m-en: fastest, English; 0.6b-v2: most accurate in English; 0.6b-v3: 25 European languages)|parakeet-tdt-110m-en parakeet-tdt-0.6b-v2-int8 parakeet-tdt-0.6b-v3-int8|parakeet-tdt-110m-en
# Build the image and download the chosen model while the running engine keeps hearing; the switch only restarts it.
prepare=parakeet
[end]
