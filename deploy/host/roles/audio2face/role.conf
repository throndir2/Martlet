# Martlet host role: NVIDIA Audio2Face-3D lip-sync.
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
# Two engines serve the same Audio2Face-3D gRPC protocol on 127.0.0.1:52000, so the gateway and desktops treat them alike:
#   local  NVIDIA's open-source Audio2Face-3D SDK, built on this host from workers/audio2face (no NVIDIA account or key)
#   nim    NVIDIA's Audio2Face-3D NIM container from nvcr.io (needs an NVIDIA NGC API key)
title=NVIDIA Audio2Face-3D lip-sync (needs an NVIDIA GPU with 4 GB+ memory)
gateway_kind=audio2face
port=52000
ready_timeout_minutes=30
requires=gpu docker nvidia-toolkit
choice=A2F_ENGINE|Audio2Face engine (local needs no NVIDIA account; nim needs an NGC API key)|local nim|local
choice=A2F_3D_MODEL_NAME|Audio2Face face model|claire mark james|claire
model_from=A2F_3D_MODEL_NAME
profile_from=A2F_ENGINE
# Hosts that installed audio2face before it had engines run the NIM.
profile_legacy=nim

[A2F_ENGINE=local]
terms=The local engine is NVIDIA's open-source Audio2Face-3D SDK (MIT). Martlet builds it into a container on this host from the SDK's pinned source with CUDA 12.8 and TensorRT 10.9 from NVIDIA's public CUDA images and apt repository (a large download; no NVIDIA account or key). On its first start it downloads the face model you choose from huggingface.co/nvidia at a pinned revision (SHA-256 checked, about 300 MB) and builds it for this GPU, which takes a few minutes. The models are licensed under the NVIDIA Open Model License; using them means accepting it. Needs an NVIDIA GPU of the RTX 20 series or newer with a driver for CUDA 12.8 (570 or newer).
[end]

[A2F_ENGINE=nim]
terms=The nim engine is NVIDIA's Audio2Face-3D NIM container from nvcr.io. Pulling and using the NIM and its models means accepting NVIDIA's terms with your own NVIDIA account (free for development and testing under the NVIDIA Developer Program; NVIDIA lists this NIM release as end of support).
secret=ngc_api_key|NVIDIA NGC API key (create one at https://org.ngc.nvidia.com/setup/api-key)
registry=nvcr.io|$oauthtoken|ngc_api_key
# NVIDIA Audio2Face-3D-Samples configs (Apache-2.0), pinned to commit a2d0150043be7dc15db2fad8193a78b660e1100f.
asset=https://raw.githubusercontent.com/NVIDIA/Audio2Face-3D-Samples/a2d0150043be7dc15db2fad8193a78b660e1100f/configs/advanced_config.yaml|configs/advanced_config.yaml
asset=https://raw.githubusercontent.com/NVIDIA/Audio2Face-3D-Samples/a2d0150043be7dc15db2fad8193a78b660e1100f/configs/deployment_config.yaml|configs/deployment_config.yaml
asset=https://raw.githubusercontent.com/NVIDIA/Audio2Face-3D-Samples/a2d0150043be7dc15db2fad8193a78b660e1100f/configs/{A2F_3D_MODEL_NAME}_stylization_config.yaml|configs/{A2F_3D_MODEL_NAME}_stylization_config.yaml
# Role services listen on loopback only; the Martlet gateway is the single LAN entry point.
rewrite=configs/deployment_config.yaml|s#0\.0\.0\.0:#127.0.0.1:#g
expect=configs/deployment_config.yaml|url: 127.0.0.1:52000
[end]
