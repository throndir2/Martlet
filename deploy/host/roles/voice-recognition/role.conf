# Martlet host role: Voice recognition. Martlet recognizes who is speaking with the same voice models as its desktop.
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
# The service (workers/voice-recognition/host/martlet_voice_recognition_host.py) answers on 127.0.0.1:50091 in the gateway's
# network namespace; the gateway's voice recognition relay is its only client. It runs pyannote segmentation 3.0 and WeSpeaker
# ResNet34-LM in sherpa-onnx 1.13.8 exactly as the desktop does (src/Martlet.Sherpa/SpeakerEngine.cs), on this host's NVIDIA
# graphics card (ONNX Runtime's CUDA provider) when it has one and otherwise on its processor.
title=Voice recognition: Martlet recognizes who is speaking with the same voice models as on your PC (on an NVIDIA graphics card or the processor)
gateway_kind=voice-recognition
port=50091
# The first start builds the image (on a graphics card it downloads about 2 GB of NVIDIA libraries); the models are in it.
ready_timeout_minutes=15
requires=docker
terms=Paired computers send the speech Martlet hears to this host, one utterance of up to a minute at a time, to recognize who is speaking. It is analyzed in memory and not stored. Voice recognition builds a container on this host from python:3.12 with hash-pinned sherpa-onnx 1.13.8 (Apache-2.0, with ONNX Runtime 1.28.2, MIT) and the same voice models as Martlet's desktop, each SHA-256 checked: WeSpeaker ResNet34-LM trained on VoxCeleb (CC BY 4.0, 27 MB, from the sherpa-onnx releases) and pyannote segmentation 3.0 (MIT, 6 MB, from Hugging Face). On an NVIDIA graphics card it installs sherpa-onnx's CUDA 12 build (from k2-fsa's Hugging Face wheels) and NVIDIA's CUDA 12 and cuDNN 9 libraries from PyPI (about 2 GB; NVIDIA's license) and needs an NVIDIA driver for CUDA 12; when CUDA doesn't work there it runs on the processor. Otherwise choose cpu.
# Uses the NVIDIA GPU when this host can run GPU containers (the default then), otherwise the CPU.
gpu=optional|compose.gpu.yaml
# ARM64 hosts run the processor build (the CUDA build is for x86_64 only).
arm64=compose.arm64.yaml
choice=VOICE_RECOGNITION_MODEL|Voice model (the same as on your PC, so voiceprints match)|wespeaker-en-voxceleb-resnet34-lm|wespeaker-en-voxceleb-resnet34-lm
model_from=VOICE_RECOGNITION_MODEL
# The port opens at once; wait until the models are loaded (on the graphics card after a CUDA check), also after a restart.
warm=voice-recognition|/usr/local/bin/python3.12 /opt/martlet-voice-recognition/host/martlet_voice_recognition_host.py wait-ready
