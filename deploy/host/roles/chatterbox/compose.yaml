# Martlet Chatterbox Turbo voice host service (the bot's speaking), loopback-only behind the Martlet gateway.
# The image is built on this host from Martlet's workers/chatterbox sources (workers/chatterbox/host/Dockerfile:
# hash-pinned PyTorch 2.8.0 CUDA 12.8 (GeForce RTX 50 series included), chatterbox-tts 0.1.7, transformers 5.2.0 and the loopback front
# martlet_chatterbox_host.py). "martlet-host add chatterbox" adds compose.gpu.yaml, then runs
# "martlet-chatterbox provision" (downloads and verifies the pinned model files into the martlet-chatterbox-models
# volume) and "martlet-chatterbox warm". The service listens only on 127.0.0.1:50083.

services:
  chatterbox:
    build:
      context: ${MARTLET_SOURCE:?set by martlet-host}/workers/chatterbox
      dockerfile: host/Dockerfile
    image: martlet-chatterbox:7
    pull_policy: build
    restart: unless-stopped
    environment:
      CHATTERBOX_MODEL: ${CHATTERBOX_MODEL:-chatterbox-turbo}
    volumes:
      - models:/opt/martlet-chatterbox/models
    network_mode: ${MARTLET_ROLE_NETWORK:?set by martlet-host}

volumes:
  models:
    name: martlet-chatterbox-models
