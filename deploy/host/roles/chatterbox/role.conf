# Martlet host role: Resemble AI Chatterbox Turbo custom voice (the bot's speaking), cloned from a reference recording you choose.
title=Chatterbox Turbo voice: Martlet's default cloning engine, with native laughter, coughs and emotion/style tags (needs an NVIDIA GPU with 6 GB+ memory)
gateway_kind=chatterbox
port=50083
ready_timeout_minutes=10
requires=x86_64 gpu docker nvidia-toolkit
terms=Chatterbox Turbo is Martlet's default voice-cloning engine (F5 stays selectable). It runs in a container Martlet builds on this host from python:3.12.10 with hash-pinned PyTorch 2.8.0 CUDA 12.8, chatterbox-tts 0.1.7 and transformers 5.2.0 (a large download), which needs an NVIDIA GPU of the GeForce GTX 16 / RTX 20 series or newer (RTX 50 series included). It then downloads the pinned Chatterbox-Turbo model from huggingface.co/ResembleAI/chatterbox-turbo, licensed MIT. Every reply carries Resemble AI's imperceptible Perth watermark. The voice is cloned from reference audio your desktop sends with each reply (longer than 5 seconds), and Martlet may pass Chatterbox's native sound and emotion/style tags; only use voices that are yours or that you have permission to use.
# Chatterbox Turbo needs the NVIDIA GPU (the worker runs on cuda:0); the overlay reserves it for the container.
gpu=required|compose.gpu.yaml
# One voice engine per host: adding this role stops the other installed voice engines first, so the model each keeps
# in the graphics card's memory never starves this one (their downloads and images are kept for switching back).
exclusive=voice
choice=CHATTERBOX_MODEL|Chatterbox voice model|chatterbox-turbo|chatterbox-turbo
model_from=CHATTERBOX_MODEL
# Download and verify the pinned model files into the martlet-chatterbox-models volume (kept on re-add), then load the
# model once so the first reply does not wait for it.
post_start=chatterbox|martlet-chatterbox provision
warm=chatterbox|martlet-chatterbox warm
