# Martlet host role: F5-TTS custom voice (the bot's speaking), cloned from a reference recording you choose.
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
title=F5-TTS voice: the bot speaks in a voice cloned from your reference recording (needs an NVIDIA GPU with 6 GB+ memory)
gateway_kind=f5
port=50080
ready_timeout_minutes=10
requires=x86_64 gpu docker nvidia-toolkit
terms=F5-TTS (MIT source) runs in a container Martlet builds on this host from python:3.12.10 with hash-pinned PyTorch 2.6.0 (CUDA 12.4), f5-tts 1.1.22 and vocos 0.1.0 (a large download). It then downloads the pinned F5TTS_v1_Base model from huggingface.co/SWivid/F5-TTS, licensed CC-BY-NC-4.0 (non-commercial use only), and the Vocos vocoder from huggingface.co/charactr/vocos-mel-24khz (MIT). Using them means accepting those licenses. The voice is cloned from reference audio your desktop sends with each reply; only use voices that are yours or that you have permission to use.
# F5 needs the NVIDIA GPU (the worker runs on cuda:0); the overlay reserves it for the container.
gpu=required|compose.gpu.yaml
# One voice engine per host: adding this role stops the other installed voice engines first, so the model each keeps
# in the graphics card's memory never starves this one (their downloads and images are kept for switching back).
exclusive=voice
choice=F5_MODEL|F5 voice model|f5tts-v1-base|f5tts-v1-base
model_from=F5_MODEL
# Download and verify the pinned model files into the martlet-f5-models volume (kept on re-add), then load the model
# once so the first reply does not wait for it.
post_start=f5|martlet-f5 provision
warm=f5|martlet-f5 warm
