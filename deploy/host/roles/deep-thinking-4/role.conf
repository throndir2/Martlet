# Martlet host role: a Thinking pool model on this host's graphics card 4 (one Thinking model per graphics card).
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
# One more Ollama server of its own, beside the deep-thinking role's (card 1) and the conversation model's, pinned to a card no
# other role uses (CUDA_VISIBLE_DEVICES). Paired desktops see it on a route of its own and use it as a Thinking pool member of
# its own, so a host with 4 cards thinks over 4 jobs at full speed at once instead of sharing one card's model.
title=Thinking pool on graphics card 4: one more Thinking pool model, on a card of its own, as a member of its own
gateway_kind=deep-thinking-4
port=11438
ready_timeout_minutes=5
requires=docker
# Needs at least 4 NVIDIA graphics cards: on fewer it would share a card that a Thinking model uses already.
min_gpus=4
terms=Ollama (MIT) runs as the official ollama/ollama container, separate from the conversation model's and the other Thinking pool models', and downloads the model you choose from ollama.com into the volume martlet-deep-thinking-4-models. Each model has its own license (Gemma 4: Apache-2.0; Gemma 3: Gemma Terms of Use; Qwen3-VL, Qwen2.5-VL 7B and Qwen 2.5 7B/14B: Apache-2.0; Llama 3.x: Llama Community License); using it means accepting that license. Paired desktops send it the task and the conversation so far when Martlet thinks something over. It runs on one graphics card of its own.
# Always on an NVIDIA graphics card: a second processor-only Ollama would only slow the first.
gpu=required|compose.gpu.yaml
# The same models, default and suggestions by GPU memory as the deep-thinking role (HostRolesTests checks they match).
choice=OLLAMA_MODEL|Thinking pool model for graphics card 4 (bigger thinks better and needs more GPU memory; gemma4, qwen3-vl, gemma3 and qwen2.5vl can also see pictures)|gemma4:e2b gemma4:e4b qwen3-vl:8b gemma4:12b gemma4:26b gemma3:4b qwen2.5vl:7b gemma3:12b gemma3:27b llama3.2:3b qwen2.5:7b llama3.1:8b qwen2.5:14b|gemma4:e2b
choice_by_vram=OLLAMA_MODEL|0@gemma4:e2b 7000@gemma4:e4b 11000@gemma4:12b 22000@gemma4:26b
model_from=OLLAMA_MODEL
# Thinks at once on this card: Ollama's OLLAMA_NUM_PARALLEL for this server (each slot beyond the first holds another think's
# context in the card's memory).
choice=OLLAMA_NUM_PARALLEL|Thinks at once on this card (each one beyond the first needs room on the graphics card for another think's context)|1 2 3 4|1
# The gateway admits that many thinks at once on this card's route and advertises it to paired desktops.
slots_from=OLLAMA_NUM_PARALLEL
post_start=ollama|ollama pull {OLLAMA_MODEL}
warm=ollama|ollama run {OLLAMA_MODEL} Say ready
retire=ollama|ollama stop {PREVIOUS}
