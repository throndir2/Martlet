# Martlet host role: Motion. Martlet makes body motions for VRM characters with Tencent's HY-Motion 1.0.
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
title=Motion: Martlet makes body motions for VRM characters from a description with HY-Motion 1.0 (optional; needs an NVIDIA GPU with 24 GB+ memory, 32 GB+ system memory and about 20 GB of downloads)
gateway_kind=motion
port=50090
ready_timeout_minutes=30
requires=x86_64 gpu docker nvidia-toolkit
terms=Motion runs in a container Martlet builds on this host from python:3.12 with pinned PyTorch 2.10 (CUDA 12.8) and Tencent's HY-Motion 1.0 code (github.com/Tencent-Hunyuan/HY-Motion-1.0 at commit 4e426f5, with its statistics and wooden body model files checked by SHA-256). It then downloads the chosen HY-Motion model from huggingface.co/tencent/HY-Motion-1.0 (revision 620dd55) and its two text encoders: Qwen3-8B (huggingface.co/Qwen/Qwen3-8B revision b968826, Apache-2.0, about 16.4 GB) and CLIP ViT-L/14 (huggingface.co/openai/clip-vit-large-patch14 revision 32bd642, MIT, about 1.7 GB), each file checked by size and SHA-256. The HY-Motion code and models are licensed under the TENCENT HY-MOTION 1.0 COMMUNITY LICENSE AGREEMENT (huggingface.co/tencent/HY-Motion-1.0/blob/main/LICENSE.txt). It does NOT apply in the European Union, the United Kingdom or South Korea: do not install or use Motion there. Organizations whose products had more than 1 million monthly active users must get a license from Tencent first. You must follow its Acceptable Use Policy: no use outside its territory, no use to harm people or minors, to impersonate people without consent or for military purposes, and mark motions you publish as machine-generated. You may not use the motions or the models to improve any other AI model. Installing means you accept these terms and those of Qwen3-8B and CLIP. Prompts must be English descriptions of body movement. Martlet frees the graphics card after five idle minutes so voice and thinking roles get it back.
# Motion needs the NVIDIA GPU (the model loads on one card). It is not a voice engine: it runs beside speaking and thinking.
gpu=required|compose.gpu.yaml
choice=MOTION_MODEL|Motion model (hy-motion-1.0-lite: 0.46B, about 1.8 GB, needs a 24 GB card; hy-motion-1.0: 1.0B, better motion, about 4.2 GB, needs a card with more than 24 GB)|hy-motion-1.0-lite hy-motion-1.0|hy-motion-1.0-lite
# Suggested model by GPU memory in MiB (ascending): the standard model only when it fits.
choice_by_vram=MOTION_MODEL|0@hy-motion-1.0-lite 26000@hy-motion-1.0
model_from=MOTION_MODEL
# Tencent's minimum graphics memory for each model (HY-Motion README): 24 GB for Lite, 26 GB for the standard model. A 24 GB
# card reports about 24 500 MiB.
[MOTION_MODEL=hy-motion-1.0-lite]
min_vram=23000|HY-Motion-1.0-Lite needs a 24 GB card
[end]
[MOTION_MODEL=hy-motion-1.0]
min_vram=26000|HY-Motion-1.0 needs 26 GB; choose hy-motion-1.0-lite for a 24 GB card
[end]
# Download and verify the chosen model and the text encoders into the martlet-motion-models volume (kept on re-add). The model
# loads when the first motion is made, not at start, so the graphics card stays free until then.
post_start=motion|martlet-motion provision
