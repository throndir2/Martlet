# Martlet host role: Singing. Martlet writes a song and sings it in a voice from your voice library.
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
title=Singing: Martlet writes a song from lyrics and a style and sings it in a voice from your voice library (needs an NVIDIA GPU with 6 GB+ memory; songs take a few minutes)
gateway_kind=singing
port=50085
ready_timeout_minutes=20
requires=x86_64 gpu docker nvidia-toolkit
terms=Singing runs in a container Martlet builds on this host from python:3.11 with hash-pinned PyTorch 2.10 (CUDA 12.8) and the pinned sources of ACE-Step 1.5 (github.com/ace-step/ACE-Step-1.5 at commit ca1e85f, MIT, with its nano-vllm, MIT), SoulX-Singer (github.com/Soul-AILab/SoulX-Singer at commit 81aeb3a, Apache-2.0), Demucs 4.0.1 (MIT) and Amphion (github.com/open-mmlab/Amphion at commit 26f6883, MIT code). It then downloads about 16 GB of pinned models: ACE-Step 1.5 turbo and SFT, its VAE, Qwen3-Embedding-0.6B and 0.6B planner (huggingface.co/ACE-Step, MIT), SoulX-Singer-SVC and its RMVPE pitch model (huggingface.co/Soul-AILab, Apache-2.0), OpenAI Whisper base (Apache-2.0) and the Demucs htdemucs_ft vocals model (dl.fbaipublicfiles.com, MIT). Using them means accepting those licenses. The songs are sung in a voice from your voice library, cloned from its recording, which the gateway hands the singing service: do not use it to imitate people without their permission, to deceive, or for anything illegal or harmful, and only use voices that are yours or that you have permission to use. ACE-Step asks you to check that songs are original and to disclose that they are AI-generated.
# Singing needs the NVIDIA GPU (the worker runs on cuda:0); the overlay reserves it for the container. It is not a voice
# engine: it runs beside the speaking role and releases the graphics card's memory after five idle minutes.
gpu=required|compose.gpu.yaml
choice=SINGING_MODEL|Singing models|ace-step-v15-soulx-svc|ace-step-v15-soulx-svc
choice=SINGING_VOICE_MATCHES|Voice matching (VevoSing is personal, non-commercial use only)|soulx soulx-vevosing|soulx
choice=SINGING_MUSIC_MODELS|Music models (XL is about 20 GB more and needs a 12 GB+ graphics card)|standard standard-xl|standard
choice=SINGING_HEARTMULA|HeartMuLa music model (about 22 GB more, a 16 GB+ graphics card)|no yes|no
choice=SINGING_DIFFRHYTHM|DiffRhythm music model (about 9 GB more, an 8 GB+ graphics card; its style model is non-commercial use only)|no yes|no
choice=SINGING_YUE|YuE music model (about 8 GB more, a 16 GB+ graphics card; personal, non-commercial use only)|no yes|no
choice=SINGING_VEVO2|Vevo2 voice match (about 3 GB more; personal, non-commercial use only)|no yes|no
choice=SINGING_SEEDVC|Seed-VC voice match (about 2.5 GB more; GPL-3.0)|no yes|no
model_from=SINGING_MODEL
# VevoSing (a second voice match: a bit closer to the voice, cleaner, may drift off-key) is downloaded only when chosen.
[SINGING_VOICE_MATCHES=soulx-vevosing]
terms=VevoSing voice match: it also downloads Amphion's Vevo1.5 models from huggingface.co/amphion/Vevo1.5 (revision f4053ca), licensed CC-BY-NC-ND-4.0: personal, non-commercial use only, and nothing made from them may be shared as a derivative; and OpenAI Whisper medium (MIT). Choose it only for your own non-commercial use.
[end]
# ACE-Step 1.5 XL (a bigger music model a song can ask for: richer music, slower, 50 steps) is downloaded only when chosen.
[SINGING_MUSIC_MODELS=standard-xl]
terms=ACE-Step 1.5 XL music model: it also downloads about 20 GB of ACE-Step 1.5 XL SFT from huggingface.co/ACE-Step/acestep-v15-xl-sft (revision d06de46), licensed MIT. It needs a graphics card with 12 GB+ memory.
[end]
# The other models the owner may add, each downloaded (and its packages built into the image) only when chosen.
[SINGING_HEARTMULA=yes]
terms=HeartMuLa music model: the image also gets HeartMuLa's heartlib (github.com/HeartMuLa/heartlib at commit 5858ca8, Apache-2.0) with torchtune 0.4.0 and torchao 0.9.0, and it downloads about 22 GB of HeartMuLa-oss-3B, HeartCodec and their tokenizer from huggingface.co/HeartMuLa, licensed Apache-2.0. It needs a graphics card with 16 GB+ memory.
[end]
[SINGING_DIFFRHYTHM=yes]
terms=DiffRhythm music model: the image also gets DiffRhythm (github.com/ASLP-lab/DiffRhythm at commit 28ad63c, Apache-2.0) with its lyrics front end and espeak-ng (GPL-3.0, a separate program), and it downloads about 9 GB: DiffRhythm 1.2 full (huggingface.co/ASLP-lab, Apache-2.0), its VAE (Stability AI Community License), MuQ-MuLan and MuQ (huggingface.co/OpenMuQ, CC-BY-NC-4.0: non-commercial use only) and XLM-RoBERTa base (MIT).
[end]
[SINGING_YUE=yes]
terms=YuE music model: the image also gets YuE2's inference package (from huggingface.co/m-a-p/YuE2-3B), and it downloads about 8 GB of YuE2-3B and its VAE from huggingface.co/m-a-p, licensed CC-BY-NC-4.0: non-commercial use only (the licensors allow individual creators to use what they make). It is slow and needs a 16 GB+ graphics card (24 GB for full precision).
[end]
[SINGING_VEVO2=yes]
terms=Vevo2 voice match: it downloads about 3 GB of Amphion's Vevo2 models from huggingface.co/RMSnow/Vevo2 (revision 2674843), licensed CC-BY-NC-ND-4.0: personal, non-commercial use only, and nothing made from them may be shared as a derivative; and OpenAI Whisper medium (MIT). Choose it only for your own non-commercial use.
[end]
[SINGING_SEEDVC=yes]
terms=Seed-VC voice match: the image also gets Seed-VC (github.com/Plachtaa/seed-vc at commit 51383ef, GPL-3.0, no longer maintained), and it downloads about 2.5 GB: its singing model (huggingface.co/Plachta/Seed-VC, GPL-3.0), RMVPE (MIT), CAMPPlus (Apache-2.0), NVIDIA BigVGAN v2 (MIT) and OpenAI Whisper small (Apache-2.0).
[end]
# Download and verify the pinned model files into the martlet-singing-models volume (kept on re-add). The models load
# when the first song is made, not at start, so the graphics card stays free until then.
post_start=singing|martlet-singing provision
