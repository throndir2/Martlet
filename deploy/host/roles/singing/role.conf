# Martlet host role: Singing. Martlet writes a song and sings it in a voice from your voice library.
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
title=Singing: Martlet writes a song from lyrics and a style and sings it in a voice from your voice library (needs an NVIDIA GPU with 6 GB+ memory; songs take a few minutes)
gateway_kind=singing
port=50085
ready_timeout_minutes=20
requires=x86_64 gpu docker nvidia-toolkit
terms=Singing runs in a container Martlet builds on this host from python:3.11 with hash-pinned PyTorch 2.10 (CUDA 12.8) and the pinned sources of ACE-Step 1.5 (github.com/ace-step/ACE-Step-1.5 at commit ca1e85f, MIT, with its nano-vllm, MIT), SoulX-Singer (github.com/Soul-AILab/SoulX-Singer at commit 81aeb3a, Apache-2.0), Demucs 4.0.1 (MIT) and Amphion (github.com/open-mmlab/Amphion at commit 26f6883, MIT code). It then downloads about 16 GB of pinned models: ACE-Step 1.5 turbo and SFT, its VAE, Qwen3-Embedding-0.6B and 0.6B planner (huggingface.co/ACE-Step, MIT), SoulX-Singer-SVC and its RMVPE pitch model (huggingface.co/Soul-AILab, Apache-2.0), OpenAI Whisper base (Apache-2.0) and the Demucs htdemucs_ft vocals model (dl.fbaipublicfiles.com, MIT). Using them means accepting those licenses. The songs are sung in a voice from your voice library, cloned from its recording, which the gateway hands the singing service: do not use it to imitate people without their permission, to deceive, or for anything illegal or harmful, and only use voices that are yours or that you have permission to use. ACE-Step asks you to check that songs are original and to disclose that they are AI-generated.
# Singing needs the NVIDIA GPU (the worker runs on cuda:0); the overlay reserves it for the container. It is not a voice
# engine: it runs beside the speaking role and releases the graphics card's memory after five idle minutes.
gpu=required|compose.gpu.yaml
choice=SINGING_MODEL|Singing models|ace-step-v15-soulx-svc|ace-step-v15-soulx-svc
choice=SINGING_VOICE_MATCHES|Voice matching (VevoSing is personal, non-commercial use only)|soulx soulx-vevosing|soulx
model_from=SINGING_MODEL
# VevoSing (a second voice match: a bit closer to the voice, cleaner, may drift off-key) is downloaded only when chosen.
[SINGING_VOICE_MATCHES=soulx-vevosing]
terms=VevoSing voice match: it also downloads Amphion's Vevo1.5 models from huggingface.co/amphion/Vevo1.5 (revision f4053ca), licensed CC-BY-NC-ND-4.0: personal, non-commercial use only, and nothing made from them may be shared as a derivative; and OpenAI Whisper medium (MIT). Choose it only for your own non-commercial use.
[end]
# Download and verify the pinned model files into the martlet-singing-models volume (kept on re-add). The models load
# when the first song is made, not at start, so the graphics card stays free until then.
post_start=singing|martlet-singing provision
