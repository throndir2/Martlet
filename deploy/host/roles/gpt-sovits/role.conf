# Martlet host role: GPT-SoVITS custom voice (the bot's speaking), cloned from a 3-10 second reference recording you choose.
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
title=GPT-SoVITS voice: the bot speaks in a voice cloned from a 3-10 second recording, good for anime-style voices (needs an NVIDIA GPU with 4 GB+ memory)
gateway_kind=gpt-sovits
port=50082
ready_timeout_minutes=15
requires=x86_64 gpu docker nvidia-toolkit
terms=GPT-SoVITS (MIT source, release 20250606v2pro) runs in its own container Martlet builds on this host from python:3.11.13 with hash-pinned PyTorch 2.6.0 (CUDA 12.4) and the GPT-SoVITS inference dependencies (a large download), plus NLTK English tagger and pronunciation data and the OpenJTalk Japanese dictionary (Modified BSD). It then downloads the pinned v2Pro weights pair (GPT s1v3 and SoVITS s2Gv2Pro) with the chinese-hubert-base (MIT), chinese-roberta-wwm-ext-large (Apache-2.0) and ERes2NetV2 speaker-verification (Apache-2.0) models from huggingface.co/lj1995/GPT-SoVITS (model card: MIT), and the fastText language-ID model lid.176 (CC-BY-SA-3.0) from dl.fbaipublicfiles.com. Using them means accepting those licenses. The voice is cloned from the reference audio and its transcript your desktop sends with each reply; only use voices that are yours or that you have permission to use.
# GPT-SoVITS needs the NVIDIA GPU (the worker runs on cuda:0); the overlay reserves it for the container.
gpu=required|compose.gpu.yaml
# One voice engine per host: adding this role stops the other installed voice engines first, so the model each keeps
# in the graphics card's memory never starves this one (their downloads and images are kept for switching back).
exclusive=voice
choice=GPT_SOVITS_MODEL|GPT-SoVITS voice model|gpt-sovits-v2pro|gpt-sovits-v2pro
model_from=GPT_SOVITS_MODEL
# Download and verify the pinned model files into the martlet-gpt-sovits-models volume (kept on re-add), then load the
# model once so the first reply does not wait for it.
post_start=gpt-sovits|martlet-gpt-sovits provision
post_start=gpt-sovits|martlet-gpt-sovits warm
