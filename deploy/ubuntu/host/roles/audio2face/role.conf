# Martlet host role: NVIDIA Audio2Face-3D lip-sync.
# Every role is installed by the same "martlet-host add <role>" flow; this file is data only.
title=NVIDIA Audio2Face-3D lip-sync (needs an NVIDIA GPU with 4 GB+ memory)
gateway_kind=audio2face
port=52000
ready_timeout_minutes=30
requires=gpu docker nvidia-toolkit
terms=Audio2Face runs as NVIDIA's NIM container from nvcr.io. Pulling and using the NIM and its models means accepting NVIDIA's terms with your own NVIDIA account.
secret=ngc_api_key|NVIDIA NGC API key (create one at https://org.ngc.nvidia.com/setup/api-key)
registry=nvcr.io|$oauthtoken|ngc_api_key
choice=A2F_3D_MODEL_NAME|Audio2Face face model|claire mark james|claire
model_from=A2F_3D_MODEL_NAME
# NVIDIA Audio2Face-3D-Samples configs (Apache-2.0), pinned to commit a2d0150043be7dc15db2fad8193a78b660e1100f.
asset=https://raw.githubusercontent.com/NVIDIA/Audio2Face-3D-Samples/a2d0150043be7dc15db2fad8193a78b660e1100f/configs/advanced_config.yaml|configs/advanced_config.yaml
asset=https://raw.githubusercontent.com/NVIDIA/Audio2Face-3D-Samples/a2d0150043be7dc15db2fad8193a78b660e1100f/configs/deployment_config.yaml|configs/deployment_config.yaml
asset=https://raw.githubusercontent.com/NVIDIA/Audio2Face-3D-Samples/a2d0150043be7dc15db2fad8193a78b660e1100f/configs/{A2F_3D_MODEL_NAME}_stylization_config.yaml|configs/{A2F_3D_MODEL_NAME}_stylization_config.yaml
# Role services listen on loopback only; the Martlet gateway is the single LAN entry point.
rewrite=configs/deployment_config.yaml|s#0\.0\.0\.0:#127.0.0.1:#g
expect=configs/deployment_config.yaml|url: 127.0.0.1:52000
