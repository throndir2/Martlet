name: Deterministic fixtures

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  text-sequence-conformance:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5 (Node 24)
        with:
          global-json-file: global.json
      - name: Restore locked fixture dependencies
        run: dotnet restore tests\Martlet.Fixtures.Tests --locked-mode
      - name: Build production validator and fixture runner
        run: dotnet build tests\Martlet.Fixtures.Tests --no-restore -c Release
      - name: Deterministic text conformance (not audio or AI qualification)
        run: dotnet test tests\Martlet.Fixtures.Tests --no-build -c Release
