name: Conversation runtime contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-text-to-pcm:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5 (Node 24)
        with:
          global-json-file: global.json
      - name: Restore locked conversation dependencies
        run: dotnet restore tests\Martlet.Conversation.Tests --locked-mode --artifacts-path "${{ runner.temp }}\conversation-artifacts"
      - name: Build production conversation runtime
        run: dotnet build tests\Martlet.Conversation.Tests --no-restore -c Release --artifacts-path "${{ runner.temp }}\conversation-artifacts"
      - name: Offline production-path HTTP and device fixtures
        run: dotnet test tests\Martlet.Conversation.Tests --no-build -c Release --artifacts-path "${{ runner.temp }}\conversation-artifacts"
