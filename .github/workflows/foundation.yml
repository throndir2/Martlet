name: Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Martlet.slnx --locked-mode
      - name: Build including WPF
        run: dotnet build Martlet.slnx --no-restore -c Release
      - name: Unit and contract tests
        run: dotnet test Martlet.slnx --no-build -c Release
      - name: Actual CLI entry point
        shell: pwsh
        run: .\scripts\Smoke-Doctor.ps1
