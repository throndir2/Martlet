name: Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5 (Node 24)
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Martlet.slnx --locked-mode
      - name: Build including WPF
        run: dotnet build Martlet.slnx --no-restore -c Release
      - name: Unit and contract tests
        run: dotnet test Martlet.slnx --no-build -c Release
      - name: Actual CLI entry point
        shell: pwsh
        run: .\scripts\Smoke-Doctor.ps1
      - name: Windows Doctor offline fixtures (audio off)
        shell: pwsh
        run: .\scripts\Smoke-Doctor.ps1 -ExecutablePath .\src\Martlet.Doctor\bin\Release\net10.0-windows\Martlet.Doctor.exe
