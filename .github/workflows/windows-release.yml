name: Release (manual) - Windows, Linux and macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version; must equal <Version> in Directory.Build.props (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: martlet-windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check release request before restoring dependencies
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_VERSION -cnotmatch '\A(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\z') {
            throw 'Use a three-part numeric release version such as 0.1.0.'
          }
          [xml]$properties = Get-Content -LiteralPath 'Directory.Build.props' -Raw
          if (([version]$properties.Project.PropertyGroup.Version).ToString(3) -cne $env:RELEASE_VERSION) {
            throw 'The requested version differs from <Version> in Directory.Build.props on main. Bump it first.'
          }
          $changes = .\scripts\Get-ReleaseNotes.ps1 -Version $env:RELEASE_VERSION
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'changes.md'), ($changes -join "`n"))
          $main = & gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $main.Trim() -cne $env:GITHUB_SHA) {
            throw 'Main changed since dispatch; dispatch again from the current main commit.'
          }
          $existing = & gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v$env:RELEASE_VERSION" --silent 2>&1
          if ($LASTEXITCODE -eq 0) { throw "Tag v$env:RELEASE_VERSION already exists; bump the version." }
          if (($existing -join "`n") -notmatch 'HTTP 404') { throw "Cannot establish absence of the release tag: $existing" }
          . .\packaging\windows\Packaging.Common.ps1
          Assert-PublicReleaseRights
          # GitHub's pwsh wrapper exits with the last native exit code; the expected tag 404 is not a failure.
          exit 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.401

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.11.1

      - name: Restore, compile and package
        shell: pwsh
        run: |
          .\packaging\windows\Build-PublicRelease.ps1 -Version $env:RELEASE_VERSION -DotnetPath (Get-Command dotnet).Source `
            -NodePath (Get-Command node).Source -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts\windows-release')
          $payload = Get-Content -LiteralPath 'artifacts\windows-release\publish\payload\manifest.json' -Raw | ConvertFrom-Json
          if ($payload.sourceDirty -or $payload.sourceCommit -cne $env:GITHUB_SHA -or
              $payload.channel -cne 'PUBLIC RELEASE - UNSIGNED') {
            throw 'The package must originate from the clean, exact dispatched main commit.'
          }
          exit 0

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = 'artifacts\windows-release\package\installer'
          $tag = "v$env:RELEASE_VERSION"
          $name = "Martlet-$env:RELEASE_VERSION-win-x64.exe"
          $installer = Join-Path $root $name
          $receipt = Join-Path $root 'installer-manifest.json'
          $sums = Join-Path $root 'SHA256SUMS.txt'
          $metadata = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          $sha = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $receiptSha = (Get-FileHash -LiteralPath $receipt -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSums = "$sha  $name`n$receiptSha  installer-manifest.json`n"
          if ($metadata.channel -cne 'PUBLIC RELEASE - UNSIGNED' -or $metadata.sourceDirty -or
              $metadata.sourceCommit -cne $env:GITHUB_SHA -or $metadata.installer -cne $name -or
              $metadata.sha256 -cne $sha -or
              [IO.File]::ReadAllText((Resolve-Path -LiteralPath $sums).ProviderPath) -cne $expectedSums) {
            throw 'The installer does not match its build receipt and source commit.'
          }
          # Main may advance during the build; the built commit only has to remain part of main's history.
          $onMain = & gh api "repos/$env:GITHUB_REPOSITORY/compare/$env:GITHUB_SHA...main" --jq '.status'
          if ($LASTEXITCODE -ne 0 -or $onMain.Trim() -notin @('identical', 'ahead')) {
            throw 'The built commit is no longer part of main; dispatch again from the current main commit.'
          }
          $existing = & gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>&1
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists; refusing to move or reuse it." }
          if (($existing -join "`n") -notmatch 'HTTP 404') { throw "Cannot establish absence of the release tag: $existing" }
          $licenseUrl = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/LICENSE"
          $noticeUrl = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/packaging/windows/DEPENDENCIES.txt"
          $changes = [IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'changes.md'))
          $changelogUrl = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/CHANGELOG.md"
          $notes = "## What's new`n`n$changes`n`n[Full changelog]($changelogUrl)`n`n## Install`n`nMartlet $env:RELEASE_VERSION for Windows 10 (version 2004 or newer) and Windows 11, x64. Download and run $name.`n`nThe installer is not code-signed, so Windows SmartScreen may show an unknown-publisher warning.`n`nLicense: $licenseUrl (personal, noncommercial use of these official binaries). Third-party components keep their own terms: $noticeUrl; full notices are included in the installer.`n`nInstaller SHA-256: $sha"
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notesFile, $notes)
          & gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA" --silent
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the version tag at the built commit.' }
          & gh release create $tag $installer $receipt $sums --repo $env:GITHUB_REPOSITORY `
            --verify-tag --title "Martlet $env:RELEASE_VERSION" --notes-file $notesFile --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release/upload failed; inspect the tag and draft before retrying.' }
          # The get-by-tag endpoint returns only published releases; find the draft through the release list.
          $assetDigest = $null
          for ($attempt = 0; $attempt -lt 6 -and -not $assetDigest; $attempt++) {
            if ($attempt -gt 0) { Start-Sleep -Seconds 5 }
            $assetDigest = & gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" `
              --jq ".[] | select(.tag_name == `"$tag`" and .draft) | .assets[] | select(.name == `"$name`") | .digest // empty"
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the draft release assets; leaving the release as a draft.' }
          }
          if ($null -eq $assetDigest -or ($assetDigest | Measure-Object).Count -ne 1 -or $assetDigest.Trim() -cne "sha256:$sha") {
            throw 'GitHub did not report the expected installer SHA-256; leaving the release as a draft.'
          }
          $publishedTag = & gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $publishedTag.Trim() -cne $env:GITHUB_SHA) {
            throw 'The release tag no longer points at the built commit; leaving the release as a draft.'
          }
          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'The release remains a draft; publication failed.' }
          exit 0

  linux:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.401

      - name: Package the AppImage and .deb files (x64 and arm64)
        run: |
          grep -q "<Version>$RELEASE_VERSION</Version>" Directory.Build.props || { echo '::error::The requested version differs from <Version> in Directory.Build.props.'; exit 1; }
          bash packaging/linux/build-linux.sh --version "$RELEASE_VERSION" --arch x64 --arch arm64 --output "$RUNNER_TEMP/linux"
          mkdir -p dist && mv "$RUNNER_TEMP"/linux/*.AppImage "$RUNNER_TEMP"/linux/*.deb dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  macos:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.401

      - name: Package the .dmg files (Apple silicon and Intel), with the Mac host inside the app
        run: |
          grep -q "<Version>$RELEASE_VERSION</Version>" Directory.Build.props || { echo '::error::The requested version differs from <Version> in Directory.Build.props.'; exit 1; }
          bash packaging/macos/build-macos.sh --version "$RELEASE_VERSION" --arch arm64 --arch x64 --output "$RUNNER_TEMP/macos" \
            --host-project src/Martlet.Gateway.Host.Linux/Martlet.Gateway.Host.Linux.csproj
          mkdir -p dist && mv "$RUNNER_TEMP"/macos/*.dmg dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  attach:
    needs: [release, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Attach the Linux and macOS packages to the release
        run: |
          tag="v$RELEASE_VERSION"
          gh release view "$tag" --json tagName >/dev/null || { echo "::error::Release $tag does not exist; the Windows job must create it first."; exit 1; }
          [ "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA" ] || { echo "::error::Tag $tag does not point at the built commit."; exit 1; }
          cd dist
          files=(Martlet-"$RELEASE_VERSION"-linux-x64.AppImage martlet_"$RELEASE_VERSION"_amd64.deb
                 Martlet-"$RELEASE_VERSION"-linux-arm64.AppImage martlet_"$RELEASE_VERSION"_arm64.deb
                 Martlet-"$RELEASE_VERSION"-macos-arm64.dmg Martlet-"$RELEASE_VERSION"-macos-x64.dmg)
          sha256sum "${files[@]}" > "$RUNNER_TEMP/sums.txt"
          gh release upload "$tag" "${files[@]}"
          for f in "${files[@]}"; do
            want="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
            got=$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq ".assets[] | select(.name == \"$f\") | .digest")
            [ "$got" = "$want" ] || { echo "::error::GitHub reports $got for $f, expected $want."; exit 1; }
          done
          gh release view "$tag" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "## Linux and macOS (desktop companion)"
            echo
            echo "**Linux** (64-bit Intel/AMD: x64 or amd64; ARM: arm64). Ubuntu and Debian: \`sudo apt install ./martlet_${RELEASE_VERSION}_amd64.deb\`. Any distribution: make the AppImage executable (\`chmod +x\`) and run it; it needs WebKitGTK 4.1 (\`libwebkit2gtk-4.1-0\`) and libsecret from your distribution."
            echo
            echo "**macOS 14 or newer**: Martlet-${RELEASE_VERSION}-macos-arm64.dmg for Apple silicon (About This Mac shows \"Chip\"), -macos-x64.dmg for Intel (\"Processor\"). Drag Martlet to Applications. The app is ad-hoc signed only, not Developer ID signed or notarized: the first time, macOS says it cannot check Martlet; choose Done, then System Settings > Privacy & Security > **Open Anyway** and confirm. You do this once per version."
            echo
            echo "SHA-256 (the GitHub asset digest checks the download is intact, not who published it):"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/sums.txt"
            echo '```'
          } >> "$RUNNER_TEMP/notes.md"
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"